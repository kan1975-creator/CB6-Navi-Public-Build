gradle.projectsEvaluated {
  def app = gradle.rootProject.project(':app')
  app.tasks.register('cb6ResolveBuildDependencies') {
    doLast {
      ['webReleaseAnnotationProcessorClasspath','coreLibraryDesugaring'].each { name ->
        app.configurations.getByName(name).files.each { println('RESOLVED ' + name + ': ' + it.name) }
      }
      ['com.android.tools.build:aapt2:8.13.2-14304508:linux',
       'com.android.tools:desugar_jdk_libs:2.1.5',
       'com.android.tools:desugar_jdk_libs_configuration:2.1.5'].each { notation ->
        def c = app.configurations.detachedConfiguration(app.dependencies.create(notation))
        c.files.each { println('RESOLVED ' + notation + ': ' + it.name) }
      }
    }
  }
}
