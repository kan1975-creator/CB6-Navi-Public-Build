name: CB6 Hourly Development Cycle
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cycle-accountability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Monitoring policy
        run: python3 v2/monitoring/verify_monitoring_policy.py
      - name: Development method gate
        run: python3 v2/gates/verify_method_completion.py
      - name: Report cycle basis
        run: |
          echo "CB6 hourly cycle basis_head=$GITHUB_SHA run_id=$GITHUB_RUN_ID"
          echo "This workflow verifies hourly liveness; durable cycle outcome evidence remains required by monitoring policy."
