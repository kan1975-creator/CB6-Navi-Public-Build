name: CB6 Development Gate
on:
  push:
    branches: [cb6-v2-clean]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repository syntax preflight
        run: python3 v2/tests/test_repository_syntax.py
      - name: Verify monitoring policy and cycle accountability
        run: python3 v2/monitoring/verify_monitoring_policy.py
      - name: Destructive monitoring policy test
        run: python3 v2/tests/test_monitoring_policy_fail_closed.py
      - name: Verify future continuing-rule registry coverage
        run: python3 v2/gates/verify_operational_rule_registry.py
      - name: Verify rule adoption lifecycle
        run: python3 v2/gates/verify_rule_adoption_lifecycle.py
      - name: Destructive rule adoption lifecycle test
        run: python3 v2/tests/test_rule_adoption_lifecycle_fail_closed.py
      - name: Verify method revision procedure
        run: python3 v2/gates/verify_method_revision_procedure.py
      - name: Destructive method revision procedure test
        run: python3 v2/tests/test_method_revision_procedure_fail_closed.py
      - name: Verify governance independent review invariants
        run: python3 v2/gates/verify_governance_independent_review.py
      - name: Destructive governance independent review test
        run: python3 v2/tests/test_governance_independent_review_fail_closed.py
      - name: Destructive future-rule intake test
        run: python3 v2/tests/test_operational_rule_registry_fail_closed.py
      - name: Verify Registry-Coverage bidirectional consistency
        run: python3 v2/gates/verify_rule_coverage.py
      - name: Destructive Registry-Coverage consistency test
        run: python3 v2/tests/test_rule_coverage_fail_closed.py
      - name: Notification stale-state behavior/destructive test
        run: python3 v2/tests/test_notification_stale_state.py
      - name: Verify workflow meta structure
        run: python3 v2/gates/verify_workflow_meta.py
      - name: Destructive workflow meta test
        run: python3 v2/tests/test_workflow_meta_fail_closed.py
      - name: Verify mechanism catalog
        run: python3 v2/gates/verify_verification_mechanisms.py
      - name: Gate result classification destructive test
        run: python3 v2/tests/test_gate_result_classification.py
      - name: Verify method-version coverage across all feature contracts
        run: python3 v2/gates/verify_method_version_coverage.py
      - name: Destructive method-version coverage test
        run: python3 v2/tests/test_method_version_coverage_fail_closed.py
      - name: Verify ACTIVE Status Reporting v3 four-line contract
        run: python3 v2/gates/verify_status_reporting_active_v3.py
      - name: Destructive ACTIVE Status Reporting v3 test
        run: python3 v2/tests/test_status_reporting_active_v3_fail_closed.py
      - name: Verify ACTIVE Cross-Cutting Rule Foundation
        run: python3 v2/gates/verify_cross_cutting_rule_foundation_active.py
      - name: Destructive ACTIVE Cross-Cutting Rule Foundation test
        run: python3 v2/tests/test_cross_cutting_rule_foundation_active_fail_closed.py
      - name: Verify root invariants and repository-only reconstruction
        run: python3 v2/gates/verify_root_invariants.py
      - name: Destructive context-loss root tests
        run: python3 v2/tests/test_root_invariants.py
      - name: Derive root certification from executable proofs
        run: python3 v2/gates/run_root_certification.py
      - name: Verify frozen development method
        run: python3 v2/gates/verify_method_freeze.py
      - name: Verify executable method completion when implementation is enabled
        run: |
          if grep -q '"stage": "IMPLEMENTATION_ENABLED"' v2/gates/project_state.json; then
            python3 v2/gates/verify_method_completion.py
            python3 v2/tests/test_method_completion.py
          fi
      - name: Destructive method-freeze test
        run: python3 v2/tests/test_method_freeze.py
      - name: Verify persistent CB6 project gate
        run: python3 v2/gates/verify_project_gate.py
      - name: Verify decision traceability and workflow coverage
        run: python3 v2/gates/verify_project_integrity.py
      - name: Verify rebuilt design coverage map
        run: python3 v2/gates/verify_design_coverage.py

      - name: Verify evidence inventory integrity
        run: python3 v2/gates/verify_evidence_inventory_v2.py
      - name: Destructive fail-closed regression tests
        run: python3 v2/tests/test_gate_fail_closed.py
      - name: Generic feature-contract destructive tests
        run: python3 v2/tests/test_feature_gate_contract.py
      - name: APK evidence destructive tests
        run: python3 v2/tests/test_apk_evidence_fail_closed.py
      - name: Device evidence destructive tests
        run: python3 v2/tests/test_device_evidence_fail_closed.py
      - name: Post-gate control stamp destructive tests
        run: python3 v2/tests/test_gate_stamp_fail_closed.py

      - name: Final acceptance destructive tests
        run: python3 v2/tests/test_final_acceptance_fail_closed.py

      - name: Verify stage-specific feature-build control
        run: |
          if grep -q '"stage": "OVERALL_DESIGN_REBUILD"' v2/gates/project_state.json; then
            echo 'Overall-design rebuild stage: feature builds remain blocked by the persistent project gate'
          else
            python3 v2/gates/verify_method_completion.py
            echo 'Implementation stage executable completion proof confirmed'
          fi
