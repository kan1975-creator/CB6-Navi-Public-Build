name: CB6 Signal Stock z17 MWM Index Experiment

on:
  workflow_dispatch:
  push:
    branches:
      - cb6-v2-clean
    paths:
      - '.github/workflows/signal_stock_z17_mwm_index_experiment.yml'

permissions:
  contents: read

jobs:
  experiment:
    name: Reindex Hokkaido West MWM for stock signal z17
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      COMAPS_SHA: 7113ccb5f086183f8884b2aa4e58c987466b6704
      MAP_VERSION: "260830"
      MAP_NAME: "Japan_Hokkaido Region_West"
    steps:
      - name: Checkout CB6 control repo
        uses: actions/checkout@v4

      - name: Record experiment authority
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          git rev-parse HEAD | tee out/CB6_HEAD.txt
          printf '%s\n' "$COMAPS_SHA" | tee out/COMAPS_SHA.txt
          printf '%s\n' "$MAP_VERSION" | tee out/MAP_VERSION.txt
          printf '%s\n' "$MAP_NAME" | tee out/MAP_NAME.txt

      - name: Install generator dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -y
          sudo apt-get install -y ninja-build cmake qt6-base-dev qt6-declarative-dev qt6-positioning-dev libqt6svg6-dev optipng libfreetype-dev libharfbuzz-dev libxkbcommon-dev libxkbcommon-x11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev python3-pip python3-venv rsync jq zlib1g-dev

      - name: Clone exact pinned CoMaps
        shell: bash
        run: |
          set -euxo pipefail
          git init comaps
          git -C comaps remote add origin https://github.com/comaps/comaps.git
          git -C comaps fetch --depth=1 origin "$COMAPS_SHA"
          git -C comaps checkout --detach FETCH_HEAD
          test "$(git -C comaps rev-parse HEAD)" = "$COMAPS_SHA"
          git -C comaps submodule sync --recursive
          git -C comaps submodule update --init --recursive --depth=1 --jobs=8

      - name: Apply only approved stock traffic signal z17 style delta
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("comaps/data/styles/default/include/Icons.mapcss")
          s = p.read_text()
          old = "node|z19-[highway=traffic_signals],"
          new = "node|z17-[highway=traffic_signals],"
          assert s.count(old) == 1
          assert new not in s
          p.write_text(s.replace(old, new, 1))
          PY
          git -C comaps diff -- data/styles/default/include/Icons.mapcss | tee out/STOCK_Z17_STYLE.patch
          test "$(git -C comaps diff --name-only | wc -l)" -eq 1
          test "$(git -C comaps diff --name-only)" = "data/styles/default/include/Icons.mapcss"

      - name: Regenerate drawing rules for z17 visibility
        shell: bash
        run: |
          set -euxo pipefail
          cd comaps
          SKIP_MAP_DOWNLOAD=1 SKIP_GENERATE_SYMBOLS=1 ./configure.sh 2>&1 | tee ../out/CONFIGURE_DRULES.log
          grep -F 'node|z17-[highway=traffic_signals],' data/styles/default/include/Icons.mapcss

      - name: Build matching generator_tool
        shell: bash
        run: |
          set -euxo pipefail
          cd comaps
          SKIP_MAP_DOWNLOAD=1 SKIP_GENERATE_SYMBOLS=1 SKIP_GENERATE_DRULES=1 ./tools/unix/build_omim.sh -r generator_tool 2>&1 | tee ../out/GENERATOR_BUILD.log
          test -x ../omim-build-release/generator_tool
          ../omim-build-release/generator_tool --help > ../out/GENERATOR_HELP.txt 2>&1 || true

      - name: Download exact CoMaps Hokkaido West MWM
        shell: bash
        run: |
          set -euxo pipefail
          cd comaps/data
          SERVERS="$(curl -fsSL "https://cdn-us-1.comaps.app/servers?version=$MAP_VERSION")"
          printf '%s\n' "$SERVERS" | tee ../../out/CDN_SERVERS.json
          CDN="$(printf '%s' "$SERVERS" | jq -r '.[0]')"
          test -n "$CDN"
          test "$CDN" != "null"
          URL="$CDN/maps/$MAP_VERSION/$(python3 -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["MAP_NAME"]+".mwm"))')"
          printf '%s\n' "$URL" | tee ../../out/MWM_SOURCE_URL.txt
          curl --fail --location --retry 3 --output "$MAP_NAME.mwm" "$URL"
          test -s "$MAP_NAME.mwm"
          sha256sum "$MAP_NAME.mwm" | tee ../../out/MWM_BEFORE_SHA256.txt
          stat --printf='%s\n' "$MAP_NAME.mwm" | tee ../../out/MWM_BEFORE_SIZE.txt

      - name: Rebuild only visibility scale index
        shell: bash
        run: |
          set -euxo pipefail
          cd comaps
          ../omim-build-release/generator_tool --generate_index=true --output="$MAP_NAME" 2>&1 | tee ../out/GENERATE_INDEX.log
          test -s "data/$MAP_NAME.mwm"
          sha256sum "data/$MAP_NAME.mwm" | tee ../out/MWM_AFTER_SHA256.txt
          stat --printf='%s\n' "data/$MAP_NAME.mwm" | tee ../out/MWM_AFTER_SIZE.txt
          ! cmp -s ../out/MWM_BEFORE_SHA256.txt ../out/MWM_AFTER_SHA256.txt

      - name: Package experiment evidence
        shell: bash
        run: |
          set -euxo pipefail
          cp "comaps/data/$MAP_NAME.mwm" out/
          cat > out/RESULT.txt <<EOF
          Experiment: stock CoMaps traffic_signals z19 -> z17 visibility index rebuild
          CoMaps: $COMAPS_SHA
          Map version: $MAP_VERSION
          Map: $MAP_NAME.mwm
          Scope: index-only experiment; no CB6_SIGNAL/Overpass/application behavior changes
          EOF

      - name: Upload reindexed MWM and evidence
        uses: actions/upload-artifact@v4
        with:
          name: CB6-Signal-z17-Hokkaido-West-MWM-Experiment
          path: out/
          if-no-files-found: error
          retention-days: 7
