name: Auditor V2 Final Red Team E2E Candidate

on:
  workflow_dispatch:
  push:
    branches: [cb6-v2-clean]
    paths:
      - 'v2/gates/development_auditor_v2_final_red_team_e2e_cases.json'
      - 'v2/gates/verify_development_auditor_v2_final_red_team_e2e.py'
      - 'v2/tests/test_development_auditor_v2_final_red_team_e2e_fail_closed.py'
      - '.github/workflows/development_auditor_v2_final_red_team_e2e_candidate.yml'

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 v2/gates/verify_development_auditor_v2_final_red_team_e2e.py
      - run: python3 v2/tests/test_development_auditor_v2_final_red_team_e2e_fail_closed.py
