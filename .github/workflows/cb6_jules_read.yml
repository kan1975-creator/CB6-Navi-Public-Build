name: CB6 Jules READ (manual)
on:
  workflow_dispatch:
    inputs:
      session_id:
        description: Jules session numeric ID
        required: true
        default: '8061497760758145992'
permissions:
  contents: read
concurrency:
  group: cb6-jules-read
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install age
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends age
      - name: Verify recipient before READ
        shell: bash
        env:
          AGE_RECIPIENT: ${{ vars.CB6_JULES_AGE_RECIPIENT }}
          EXPECTED_SHA256: '47d8d975828b1d8c3d622a9c1c8761f944d171a0080a30b9cf960961b8fba7f4'
        run: |
          set -euo pipefail
          # Hash the exact UTF-8 value without trimming or adding a newline.
          python - <<'PY'
          import hashlib, os, re
          recipient = os.environ['AGE_RECIPIENT']
          if not re.fullmatch(r'age1[023456789acdefghjklmnpqrstuvwxyz]{58}', recipient):
              raise SystemExit('Invalid age recipient format')
          if hashlib.sha256(recipient.encode('utf-8')).hexdigest() != os.environ['EXPECTED_SHA256']:
              raise SystemExit('Recipient SHA-256 mismatch')
          PY
          # Let age itself validate the checksum and recipient before any API call.
          if ! age --encrypt --recipient "$AGE_RECIPIENT" < /dev/null > /dev/null 2>&1; then
            echo 'age rejected recipient' >&2
            exit 1
          fi
      - name: READ and encrypt evidence
        id: evidence
        shell: bash
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          SESSION_ID: ${{ inputs.session_id }}
          AGE_RECIPIENT: ${{ vars.CB6_JULES_AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          umask 077
          work="$RUNNER_TEMP/cb6-jules-read-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -m 700 -- "$work"
          plain="$work/jules_evidence.json"
          cipher="$work/jules_evidence.json.age"
          cleanup() {
            status=$?
            trap - EXIT
            rm -f -- "$plain" "$work/read.stderr"
            if [ "$status" -ne 0 ]; then
              rm -f -- "$cipher" "$cipher.tmp"
            fi
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          if ! python tools/jules_bridge.py --mode read --session "$SESSION_ID" --output "$plain" > /dev/null 2> "$work/read.stderr"; then
            # Emit only hard-coded classifications; never print captured stderr.
            python - "$work/read.stderr" <<'PY'
          import pathlib, re, sys
          raw = pathlib.Path(sys.argv[1]).read_bytes()[:4096].decode('utf-8', 'replace')
          known = {
              'ERROR: JULES_API_KEY not configured': 'API key not configured',
              'ERROR: Jules API network error': 'network error',
              'ERROR: Jules API timeout': 'timeout',
              'ERROR: Jules API invalid JSON response': 'invalid JSON response',
          }
          stage_match = re.fullmatch(r'ERROR: Jules READ stage (session|activities|serialize|write) category (HTTP_(?:400|401|403|404|405|408|409|422|429|500|502|503|504|OTHER)|NETWORK|TIMEOUT|INVALID_JSON|ACTIVITY_LIMIT|PAGINATION_LIMIT|EVIDENCE_LIMIT|RESPONSE_LIMIT|RESPONSE_SHAPE|IO|OTHER)\\s*', raw)
          if stage_match:
              print('Jules READ failed: stage ' + stage_match.group(1) + ', category ' + stage_match.group(2), file=sys.stderr)
          elif raw.strip() in known:
              print('Jules READ failed: ' + known[raw.strip()], file=sys.stderr)
          else:
              match = re.fullmatch(r'ERROR: Jules API HTTP (\d{3})\s*', raw)
              allowed = {'400', '401', '403', '404', '408', '429', '500', '502', '503', '504'}
              if match and match.group(1) in allowed:
                  print('Jules READ failed: HTTP ' + match.group(1), file=sys.stderr)
              else:
                  print('Jules READ failed: unclassified error (details suppressed)', file=sys.stderr)
          PY
            exit 1
          fi
          rm -f -- "$work/read.stderr"
          if ! python - "$plain" > /dev/null 2>&1 <<'PY'
          import json, sys
          from pathlib import Path
          p = Path(sys.argv[1])
          if not 0 < p.stat().st_size <= 10_000_000:
              raise SystemExit(1)
          with p.open(encoding='utf-8') as f:
              value = json.load(f)
          if not isinstance(value, dict) or not isinstance(value.get('session'), dict) or not isinstance(value.get('activities'), list):
              raise SystemExit(1)
          PY
          then
            echo 'Invalid evidence JSON; output suppressed' >&2
            exit 1
          fi
          if ! age --encrypt --recipient "$AGE_RECIPIENT" --output "$cipher.tmp" "$plain" > /dev/null 2>&1; then
            echo 'Evidence encryption failed' >&2
            exit 1
          fi
          test -s "$cipher.tmp"
          mv -- "$cipher.tmp" "$cipher"
          rm -f -- "$plain"
          test ! -e "$plain"
      - name: Upload encrypted evidence only
        if: ${{ success() && steps.evidence.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: jules-evidence-encrypted-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cb6-jules-read-${{ github.run_id }}-${{ github.run_attempt }}/jules_evidence.json.age
          if-no-files-found: error
          retention-days: 1
      - name: Remove local evidence on every outcome
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- "$RUNNER_TEMP/cb6-jules-read-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
