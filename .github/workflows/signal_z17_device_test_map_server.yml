name: CB6 Signal z17 Device Test Map Server

on:
  workflow_dispatch:
  push:
    branches:
      - cb6-v2-clean
    paths:
      - '.github/workflows/signal_z17_device_test_map_server.yml'

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cb6-signal-z17-device-test-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Record approved authority
        run: |
          {
            echo "approval_id=OPS-USER-APPROVAL-BEFORE-FIX-001-20261002-SIGNAL-Z17-SAPPORO-MWM"
            echo "approved_at=2026-10-02"
            echo "proposed_change_id=SIGNAL-Z17-SAPPORO-MWM-001"
            echo "approved_change_summary=Signal z17実機検証について、試験対象MWMをHokkaido WestからJapan_Hokkaido Region_Sapporoへ変更し、同じz17 visibility index再構築・整合性検証・試験用Map Server配布を行う最小変更"
            echo "source_run=36890189315"
            echo "source_artifact_id=11177340502"
            echo "source_head=a43f7f69f26d2bbf18f8c8511f8b2eb3fdc717b6"
            echo "update_check_approval_id=OPS-USER-APPROVAL-BEFORE-FIX-001-20261002-SIGNAL-Z17-MAPSERVER-MAPS-META"
            echo "update_check_proposed_change_id=SIGNAL-Z17-MAPSERVER-MAPS-META-001"
          } | tee authority.txt

      - name: Download approved reindexed MWM artifact
        uses: actions/download-artifact@v4
        with:
          name: CB6-Signal-z17-Hokkaido-Sapporo-MWM-Experiment
          repository: kan1975-creator/CB6-Navi-Public-Build
          run-id: 36890189315
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source

      - name: Verify and stage only Hokkaido Sapporo MWM
        shell: bash
        run: |
          set -euxo pipefail
          MWM="$(find source -type f -name 'Japan_Hokkaido Region_Sapporo.mwm' -print -quit)"
          test -n "$MWM"
          test "$(stat --printf='%s' "$MWM")" = "74474156"
          echo "ad9fdec227264b80a35e7de7b0f9b344e100270b33ba806a3060b7e7ec8dd04e  $MWM" | sha256sum --check --strict
          mkdir -p "public/maps/2026.06.28/260830" "public/maps/2026.06.28/260927"
          cp "$MWM" "public/maps/2026.06.28/260830/Japan_Hokkaido Region_Sapporo.mwm"
          cp "$MWM" "public/maps/2026.06.28/260927/Japan_Hokkaido Region_Sapporo.mwm"
          cp authority.txt public/authority.txt
          mkdir -p public/meta
          printf '%s\n' '{"map-series":{"2026.06.28":{"latest":260830,"status":"active"}}}' > public/meta/maps.json
          python3 -c 'import json; data=json.load(open("public/meta/maps.json", encoding="utf-8")); entry=data["map-series"]["2026.06.28"]; assert entry["latest"] == 260830; assert entry["status"] != "EOL"'
          test -f "public/maps/2026.06.28/260830/Japan_Hokkaido Region_Sapporo.mwm"
          test "$(stat --printf='%s' "public/maps/2026.06.28/260830/Japan_Hokkaido Region_Sapporo.mwm")" = "74474156"
          echo "ad9fdec227264b80a35e7de7b0f9b344e100270b33ba806a3060b7e7ec8dd04e  public/maps/2026.06.28/260830/Japan_Hokkaido Region_Sapporo.mwm" | sha256sum --check --strict
          test -f "public/maps/2026.06.28/260927/Japan_Hokkaido Region_Sapporo.mwm"
          test "$(stat --printf='%s' "public/maps/2026.06.28/260927/Japan_Hokkaido Region_Sapporo.mwm")" = "74474156"
          echo "ad9fdec227264b80a35e7de7b0f9b344e100270b33ba806a3060b7e7ec8dd04e  public/maps/2026.06.28/260927/Japan_Hokkaido Region_Sapporo.mwm" | sha256sum --check --strict
          test -s public/meta/maps.json
          sha256sum "public/maps/2026.06.28/260830/Japan_Hokkaido Region_Sapporo.mwm" "public/maps/2026.06.28/260927/Japan_Hokkaido Region_Sapporo.mwm" | tee public/MWM_SHA256.txt
          find public -type f -print

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload test map server
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy test map server
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed 260927 Sapporo MWM size
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euxo pipefail
          URL="${PAGE_URL%/}/maps/2026.06.28/260927/Japan_Hokkaido%20Region_Sapporo.mwm"
          HEADERS="$(mktemp)"
          curl --fail --silent --show-error --location --range 0-0 --dump-header "$HEADERS" --output /dev/null "$URL"
          CONTENT_RANGE="$(tr -d '\r' < "$HEADERS" | awk 'BEGIN{IGNORECASE=1} /^content-range:/ {print $2; exit}')"
          test "$CONTENT_RANGE" = "bytes 0-0/74474156"
