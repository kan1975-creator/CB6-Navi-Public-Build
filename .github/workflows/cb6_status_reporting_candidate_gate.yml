name: CB6 Status Reporting Candidate Gate
on:
  workflow_dispatch:
  push:
    branches: [cb6-v2-clean]
    paths:
      - 'v2/gates/status_reporting_contract_candidate_v1.json'
      - 'v2/gates/verify_status_reporting_candidate.py'
      - 'v2/tests/test_status_reporting_candidate_fail_closed.py'
      - 'v2/gates/status_reporting_method_revision_candidate.json'
      - 'v2/gates/status_reporting_contract_candidate_v2.json'
      - 'v2/gates/verify_status_reporting_candidate_v2.py'
      - 'v2/tests/test_status_reporting_candidate_v2_fail_closed.py'
      - 'v2/gates/status_reporting_contract_candidate_v4.json'
      - 'v2/gates/verify_status_reporting_candidate_v4.py'
      - 'v2/tests/test_status_reporting_candidate_v4_fail_closed.py'
      - 'v2/gates/status_reporting_contract_candidate_v5.json'
      - 'v2/gates/verify_status_reporting_candidate_v5.py'
      - 'v2/tests/test_status_reporting_candidate_v5_fail_closed.py'
      - 'v2/gates/status_reporting_contract_candidate_v6.json'
      - 'v2/gates/verify_status_reporting_candidate_v6.py'
      - 'v2/tests/test_status_reporting_candidate_v6_fail_closed.py'
      - 'v2/gates/status_reporting_contract_candidate_v7.json'
      - 'v2/gates/verify_status_reporting_candidate_v7.py'
      - 'v2/tests/test_status_reporting_candidate_v7_fail_closed.py'
      - 'v2/gates/status_reporting_contract_candidate_v8.json'
      - 'v2/gates/verify_status_reporting_candidate_v8.py'
      - 'v2/tests/test_status_reporting_candidate_v8_fail_closed.py'
      - '.github/workflows/cb6_status_reporting_candidate_gate.yml'
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify pre-adoption status-reporting candidate
        run: python3 v2/gates/verify_status_reporting_candidate.py
      - name: Destructive status-reporting candidate test
        run: python3 v2/tests/test_status_reporting_candidate_fail_closed.py
      - name: Verify status-reporting v2 candidate
        run: python3 v2/gates/verify_status_reporting_candidate_v2.py
      - name: Destructive status-reporting v2 candidate test
        run: python3 v2/tests/test_status_reporting_candidate_v2_fail_closed.py
      - name: Verify status-reporting v4 smartphone-action candidate
        run: python3 v2/gates/verify_status_reporting_candidate_v4.py
      - name: Destructive status-reporting v4 smartphone-action test
        run: python3 v2/tests/test_status_reporting_candidate_v4_fail_closed.py
      - name: Verify status-reporting v5 wait-time candidate
        run: python3 v2/gates/verify_status_reporting_candidate_v5.py
      - name: Destructive status-reporting v5 wait-time test
        run: python3 v2/tests/test_status_reporting_candidate_v5_fail_closed.py
      - name: Verify status-reporting v6 final-summary candidate
        run: python3 v2/gates/verify_status_reporting_candidate_v6.py
      - name: Destructive status-reporting v6 final-summary test
        run: python3 v2/tests/test_status_reporting_candidate_v6_fail_closed.py
      - name: Verify status-reporting v7 normal-duration candidate
        run: python3 v2/gates/verify_status_reporting_candidate_v7.py
      - name: Destructive status-reporting v7 normal-duration test
        run: python3 v2/tests/test_status_reporting_candidate_v7_fail_closed.py
      - name: Verify status-reporting v8 all-process wait-evidence candidate
        run: python3 v2/gates/verify_status_reporting_candidate_v8.py
      - name: Destructive status-reporting v8 all-process wait-evidence test
        run: python3 v2/tests/test_status_reporting_candidate_v8_fail_closed.py
      - name: Verify active Development Gate remains frozen
        run: python3 v2/gates/verify_method_freeze.py
      - name: Verify active method revision procedure
        run: python3 v2/gates/verify_method_revision_procedure.py
      - name: Confirm candidate has not self-activated
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("v2/gates/operational_rule_registry_v4.json").read_text())
          c=json.loads(Path("v2/gates/status_reporting_contract_candidate_v2.json").read_text())
          rows=[x for x in r["rules"] if x["id"]=="OPS-STATUS-REPORTING-001"]
          if len(rows)!=1 or rows[0]["status"]!="ACTIVE":
              raise SystemExit("active status-reporting authority drifted")
          if c["status"]!="CANDIDATE":
              raise SystemExit("candidate status drifted")
          print("PASS: Registry v4 ACTIVE authority unchanged; v2 status-reporting remains CANDIDATE")
          PY
