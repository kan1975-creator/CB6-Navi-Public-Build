name: Development Auditor v2 Independent Review
on:
  push:
    branches: [cb6-v2-clean]
    paths:
      - 'v2/gates/development_auditor_candidate_v2.json'
      - 'v2/gates/development_auditor_work_unit_schema_v1.json'
      - 'v2/gates/verify_development_auditor_v2_independent_review.py'
      - 'v2/tests/test_development_auditor_v2_independent_review_fail_closed.py'
      - '.github/workflows/development_auditor_v2_independent_review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Independent semantic review
        run: python3 v2/gates/verify_development_auditor_v2_independent_review.py
      - name: Independent destructive tests
        run: python3 v2/tests/test_development_auditor_v2_independent_review_fail_closed.py
