# CB6 trusted-default-main PR approval. Required Check only after owner adoption.
# pull_request_target may be restricted for public repositories by
# GitHub Actions event policy (Nov 2 2026 enforcement). Policy authorization
# must be maintained. No PR head checkout, no secret injection.
# Trusted workflow resides on default main; PR base can be main or cb6-v2-clean.
# Rule-set enforcement requires separate owner approval and GitHub verification.
name: CB6 Personal Approval Trusted Main Candidate
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  cb6-personal-approval-trusted-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # NEVER gate the job via 'if:'; a skipped Required Check may count as success.
    steps:
      - name: Checkout trusted default-main event SHA (never PR head/merge)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Ensure checkout is trusted default-main event commit
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = 'pull_request_target'
          test "$GITHUB_REPOSITORY" = 'kan1975-creator/CB6-Navi-Public-Build'
          test "$GITHUB_REF" = 'refs/heads/main'
          case "$GITHUB_BASE_REF" in
            main|cb6-v2-clean) ;;
            *) exit 1 ;;
          esac
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f v2/gates/user_approval_before_fix_contract.json
          test -f v2/gates/verify_user_approval_before_fix.py
      - name: Verify GitHub owner approval and exact PR scope (required gate)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -I -B v2/gates/verify_user_approval_before_fix.py --personal-trusted-target-required
