# ISOLATED CANDIDATE ONLY. NOT DEPLOYED. ADVISORY CHECK, NOT a Required Check.
# Candidate pull_request adapter + original manual mode. Neither is a Required Check.
# CRITICAL: pull_request workflow YAML is sourced from PR merge; NOT trusted enforcement.
# Never check out PR head or execute PR code. The trusted main rollout is NOT done.
name: CB6 Personal Approval Candidate (Nonmandatory)
on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to inspect
        type: string
        required: true
      comment_id:
        description: GitHub approval comment ID
        type: string
        required: true
      plan_sha256:
        description: Approved canonical plan SHA-256
        type: string
        required: true
      plan_commit_sha:
        description: Commit containing canonical plan
        type: string
        required: true
      plan_path:
        description: Repository-relative canonical plan path
        type: string
        required: true
      expected_pr_head:
        description: Expected PR HEAD commit SHA
        type: string
        required: true
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  personal-check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require trusted default branch
        env:
          EXPECTED_REF: refs/heads/main
          ACTUAL_REF: ${{ github.ref }}
        run: test "$ACTUAL_REF" = "$EXPECTED_REF"
      - name: Checkout trusted main only
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Fail closed if isolated transition proposal is activated
        run: |
          python3 -I -B - <<'PYGUARD'
          import json
          from pathlib import Path
          j = json.loads(Path('v2/gates/user_approval_before_fix_contract.json').read_text())
          p = j.get('personal_formal_transition_proposal', {})
          assert j.get('status') == 'CANDIDATE'
          assert p.get('status') == 'PROPOSED_NOT_ACTIVE'
          assert p.get('allow_production_pass') is False
          assert p.get('deployment_status') == 'NOT_DEPLOYED'
          assert p.get('active_rules_unchanged') is True
          assert 'affected_scope_change_tests' in p.get('requires_before_deployment', [])
          policy = j.get('personal_completion_policy_20261013', {})
          assert policy.get('status') == 'USER_APPROVED_POLICY_ONLY'
          assert policy.get('authorization') == 'ISOLATED_LOCAL_CANDIDATE_ONLY'
          assert policy.get('github_required_check') == 'REQUIRED_FOR_FINAL_COMPLETION_NOT_IMPLEMENTED'
          assert policy.get('production_deployment') == 'NOT_AUTHORIZED'
          assert policy.get('workflow_trigger_selection') == 'UNSELECTED_PENDING_SECURITY_VALIDATION'
          PYGUARD
      - name: Inspect the GitHub user approval and PR scope read-only
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr_number }}
          COMMENT: ${{ inputs.comment_id }}
          PLAN_SHA: ${{ inputs.plan_sha256 }}
          PLAN_COMMIT: ${{ inputs.plan_commit_sha }}
          PLAN_PATH: ${{ inputs.plan_path }}
          EXPECTED_HEAD: ${{ inputs.expected_pr_head }}
        run: |
          python3 -I -B v2/gates/verify_user_approval_before_fix.py --personal-manual \
            --pr "$PR" --comment-id "$COMMENT" \
            --plan-sha "$PLAN_SHA" --plan-commit "$PLAN_COMMIT" \
            --plan-path "$PLAN_PATH" --expected-head "$EXPECTED_HEAD"

  personal-pr-proxy-candidate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main only (PR code must NEVER be executed)
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Verify trusted main supports this candidate adapter
        shell: bash
        run: |
          # This is expected to FAIL until authorized trusted-main deployment.
          # No dynamic checkout, no PR scripts, no secrets or write permissions.
          python3 -I -B - <<'PYGUARD'
          from pathlib import Path
          s = Path('v2/gates/verify_user_approval_before_fix.py').read_text()
          assert 'def personal_pr_auto_main(' in s, 'trusted main auto verifier NOT DEPLOYED'
          PYGUARD
      - name: Authenticate owner approval and PR metadata (candidate only)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I -B v2/gates/verify_user_approval_before_fix.py --personal-pr-auto
