# CANDIDATE ONLY. Not deployed. This job deliberately fails closed until a
# separately authorized protected trust anchor and merge-required check exist.
# pull_request_target uses BASE branch code only. Do not checkout PR HEAD.
name: CB6 Approval Enforcement Candidate
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: read
jobs:
  approval-enforcement:
    name: CB6 Approval Enforcement
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout trusted base only (never PR head)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Execute existing candidate regression tests
        run: python3 -B v2/tests/test_user_approval_before_fix_fail_closed.py -v
      - name: Block until protected provenance is actually deployed
        # No PR code is checked out. Untrusted event or code cannot grant trust.
        run: python3 -B v2/gates/verify_user_approval_before_fix.py
      - name: Prevent accidental PASS before independent trust and Required Check
        # Candidate cannot silently become successful if the verifier changes.
        # Future activation requires a separately authorized workflow revision.
        if: always()
        run: |
          echo "CB6 C-05/C-07 remains BLOCKED: independent trust, start and revocation authority, GitHub App check origin and required-check policy unproven"
          exit 1
