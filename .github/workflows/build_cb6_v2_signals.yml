name: CB6 V2 Gate 1 Signals

on:
  workflow_dispatch:
  push:
    branches:
      - cb6-v2-clean
    paths:
      - '.github/workflows/build_cb6_v2_signals.yml'
      - 'v2/baseline/**'
      - 'v2/audits/**'
      - 'v2/signals/**'
      - 'v2/tests/**'

permissions:
  contents: read

concurrency:
  group: cb6-v2-gate1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: V2 Gate 1 frozen signals arm64
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SKIP_MAP_DOWNLOAD: "true"
    steps:
      - name: Checkout V2 control repo
        uses: actions/checkout@v4
      - name: Enforce CB6 development gate
        run: python3 v2/gates/verify_project_gate.py --require-feature-build

      - name: Preflight control repository
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          git rev-parse HEAD > out/WORKFLOW_SHA.txt
          python3 -m compileall -q v2 scripts CB6_*.py validate_package.py
          ! grep -E 'apply_cb6_|Cb6SupplementManager|nativeSetCb6DrivingMarks' v2/signals/apply_signals.py

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Signal boundary and dense-response regression tests
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out/java-tests
          javac -d out/java-tests v2/signals/java/SignalPolicy.java v2/signals/java/SignalSnapshot.java v2/tests/SignalPolicyTest.java
          java -cp out/java-tests SignalPolicyTest | tee out/POLICY_TESTS.txt

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -y
          sudo apt-get install -y ninja-build cmake qt6-base-dev qt6-declarative-dev qt6-positioning-dev libqt6svg6-dev optipng libfreetype-dev libharfbuzz-dev libxkbcommon-dev libxkbcommon-x11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev python3-pip python3-venv rsync jq zlib1g-dev unzip
          pip install 'protobuf<3.21' --break-system-packages

      - name: Clone exact pinned CoMaps
        shell: bash
        run: |
          set -euxo pipefail
          git init comaps
          git -C comaps remote add origin https://github.com/comaps/comaps.git
          git -C comaps fetch --depth=1 origin 7113ccb5f086183f8884b2aa4e58c987466b6704
          git -C comaps checkout --detach FETCH_HEAD
          test "$(git -C comaps rev-parse HEAD)" = "7113ccb5f086183f8884b2aa4e58c987466b6704"
          git -C comaps submodule sync --recursive
          git -C comaps config submodule.3party/freetype/freetype.url https://github.com/freetype/freetype.git
          git -C comaps config submodule.3party/protobuf/protobuf.url https://github.com/protocolbuffers/protobuf.git
          for attempt in 1 2 3 4 5 6; do
            if git -C comaps submodule update --init --recursive --depth=1 --jobs=8; then break; fi
            sleep $((attempt*15))
          done
          test -f comaps/3party/protobuf/protobuf/src/google/protobuf/arena.cc
          mkdir -p out
          git -C comaps rev-parse HEAD | tee out/UPSTREAM_SHA.txt

      - name: Apply consolidated identity and signal modules
        shell: bash
        run: |
          set -euxo pipefail
          test -z "$(git -C comaps status --porcelain --untracked-files=no)"
          python3 v2/baseline/apply_identity.py comaps
          python3 v2/signals/apply_signals.py comaps
          python3 v2/audits/preflight_gate1.py comaps out/GENERATED_SOURCE_SHA256.json
          # A second application must leave every generated byte unchanged.
          python3 v2/signals/apply_signals.py comaps
          python3 v2/audits/preflight_gate1.py comaps out/GENERATED_SOURCE_SHA256.json --verify
          python3 v2/audits/audit_identity.py comaps
          python3 v2/audits/audit_signals.py comaps | tee out/SOURCE_AUDIT.txt
          git -C comaps diff --check
          git -C comaps diff > out/GATE1_UPSTREAM_DIFF.patch
          tar -czf out/GATE1_MODULE_SOURCE.tar.gz v2/signals v2/audits v2/tests

      - name: Configure resources
        shell: bash
        run: |
          set -euxo pipefail
          cd comaps
          bash -x ./configure.sh --skip-map-download 2>&1 | tee ../out/CONFIGURE.log

      - name: Final generated source and every atlas audit
        shell: bash
        run: |
          set -euxo pipefail
          python3 v2/audits/preflight_gate1.py comaps out/GENERATED_SOURCE_SHA256.json --verify
          python3 v2/audits/audit_identity.py comaps
          python3 v2/audits/audit_signals.py comaps --atlases | tee out/GENERATED_AUDIT.txt

      - name: Build CB6 Gate 1 arm64 release
        shell: bash
        run: |
          set -euxo pipefail
          cd comaps/android
          ./gradlew -Parm64 app:assembleWebRelease --no-daemon --stacktrace 2>&1 | tee ../../out/GRADLE.log

      - name: Verify Gate 1 APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p verify-apk
          APK="$(find comaps/android/app/build/outputs/apk/web/release -type f -name '*.apk' | head -1)"
          test -n "$APK"
          cp "$APK" out/CB6-V2-Gate1-Signals-arm64.apk
          unzip -q out/CB6-V2-Gate1-Signals-arm64.apk 'lib/arm64-v8a/liborganicmaps.so' -d verify-apk
          file verify-apk/lib/arm64-v8a/liborganicmaps.so | tee out/NATIVE_VERIFY.txt
          readelf -h verify-apk/lib/arm64-v8a/liborganicmaps.so | grep -E 'AArch64|ARM aarch64'
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -1)"
          "$AAPT" dump badging out/CB6-V2-Gate1-Signals-arm64.apk | tee out/APK_BADGING.txt
          grep -F "package: name='jp.cb6.navi'" out/APK_BADGING.txt
          grep -F "application-label:'CB6 Navi'" out/APK_BADGING.txt
          python3 v2/audits/audit_signals.py comaps --apk out/CB6-V2-Gate1-Signals-arm64.apk | tee out/APK_SIGNAL_AUDIT.txt
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose out/CB6-V2-Gate1-Signals-arm64.apk | tee out/SIGNATURE_VERIFY.txt
          sha256sum out/CB6-V2-Gate1-Signals-arm64.apk | tee out/SHA256SUMS.txt

      - name: Upload verified Gate 1 APK and evidence
        uses: actions/upload-artifact@v4
        with:
          name: CB6-V2-Gate1-Signals-arm64
          path: |
            out/*.apk
            out/*.txt
            out/*.json
            out/*.patch
            out/*.tar.gz
            out/*.log
          if-no-files-found: error
          retention-days: 30

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: CB6-V2-Gate1-diagnostics-${{ github.run_attempt }}
          path: |
            out/*.txt
            out/*.json
            out/*.patch
            out/*.tar.gz
            out/*.log
          if-no-files-found: warn
          retention-days: 30
