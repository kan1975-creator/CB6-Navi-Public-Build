name: CB6 Hourly Development Trigger

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  trigger-development-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve current development HEAD
        id: dev
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          DEV_HEAD="$(gh api "repos/$REPO/git/ref/heads/cb6-v2-clean" --jq '.object.sha')"
          echo "head=$DEV_HEAD" >> "$GITHUB_OUTPUT"
          echo "CB6 scheduled cycle basis_head=$DEV_HEAD run_id=$GITHUB_RUN_ID"

      - name: Dispatch development gate on current branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run "CB6 Development Gate" --repo "$REPO" --ref cb6-v2-clean
          echo "Dispatched CB6 Development Gate for basis_head=${{ steps.dev.outputs.head }}"
