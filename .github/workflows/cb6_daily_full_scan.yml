name: CB6 Daily Full Scan
on:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Workflow meta verification
        run: python3 v2/gates/verify_workflow_meta.py
      - name: Verification mechanism catalog
        run: python3 v2/gates/verify_verification_mechanisms.py
      - name: Registry-Coverage consistency
        run: python3 v2/gates/verify_rule_coverage.py
      - name: Method-version coverage
        run: python3 v2/gates/verify_method_version_coverage.py
      - name: Monitoring policy
        run: python3 v2/monitoring/verify_monitoring_policy.py
