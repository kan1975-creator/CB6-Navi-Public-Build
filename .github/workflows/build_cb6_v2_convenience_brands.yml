name: CB6 V2 Convenience Brands
# CB6 visible MWM evidence diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - cb6-v2-clean
    paths:
      - '.github/workflows/build_cb6_v2_convenience_brands.yml'
      - 'v2/poi/**'
      - 'v2/audits/audit_convenience.py'
      - 'v2/tests/convenience_brand_classifier_test.cpp'
      - 'v2/tests/convenience_audit_selftest.py'
      - 'v2/tests/signals_audit_selftest.py'
      - 'v2/gates/features/convenience-brands.json'
      - 'v2/gates/impact_records/convenience-brands.json'
      - 'v2/gates/**'
      - '.github/workflows/build_cb6_v2_signals.yml'

permissions:
  contents: read

concurrency:
  group: cb6-v2-convenience-brands-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Convenience brands native MWM arm64
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SKIP_MAP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen CB6 development method
        run: python3 v2/gates/verify_method_freeze.py
      - name: Enforce diagnostic feature gate
        run: python3 v2/gates/verify_project_gate.py --require-feature-build --feature=convenience-brands
      - name: Seal gated control state
        run: |
          python3 v2/gates/create_gate_stamp.py
          python3 v2/gates/create_gate_stamp.py --verify
      - name: Audit native MWM convenience ownership
        run: python3 v2/audits/audit_convenience.py
      - name: Prove convenience audit fail-closed behavior
        run: python3 v2/tests/convenience_audit_selftest.py
      - name: Compile and run brand classifier tests
        run: |
          set -euxo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror             v2/tests/convenience_brand_classifier_test.cpp             v2/poi/native/convenience_brand_classifier.cpp             -o /tmp/cb6-convenience-classifier-test
          /tmp/cb6-convenience-classifier-test
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update -y
          sudo apt-get install -y ninja-build cmake qt6-base-dev qt6-declarative-dev qt6-positioning-dev libqt6svg6-dev optipng libfreetype-dev libharfbuzz-dev libxkbcommon-dev libxkbcommon-x11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev python3-pip python3-venv rsync jq zlib1g-dev unzip
          pip install 'protobuf<3.21' --break-system-packages
      - name: Clone exact pinned CoMaps
        run: |
          set -euxo pipefail
          git init comaps
          git -C comaps remote add origin https://github.com/comaps/comaps.git
          git -C comaps fetch --depth=1 origin 7113ccb5f086183f8884b2aa4e58c987466b6704
          git -C comaps checkout --detach FETCH_HEAD
          test "$(git -C comaps rev-parse HEAD)" = "7113ccb5f086183f8884b2aa4e58c987466b6704"
          git -C comaps submodule sync --recursive
          git -C comaps config submodule.3party/freetype/freetype.url https://github.com/freetype/freetype.git
          git -C comaps config submodule.3party/protobuf/protobuf.url https://github.com/protocolbuffers/protobuf.git
          for attempt in 1 2 3 4 5 6; do
            if git -C comaps submodule update --init --recursive --depth=1 --jobs=8; then break; fi
            sleep $((attempt*15))
          done
          test -f comaps/3party/protobuf/protobuf/src/google/protobuf/arena.cc
          mkdir -p out
          git -C comaps rev-parse HEAD | tee out/UPSTREAM_SHA.txt
      - name: Apply CB6 identity, Signal and dedicated convenience brands
        run: |
          set -euxo pipefail
          test -z "$(git -C comaps status --porcelain --untracked-files=no)"
          python3 v2/baseline/apply_identity.py comaps
          python3 v2/signals/apply_signals.py comaps
          python3 v2/poi/apply_convenience_brand_render.py comaps
          python3 v2/audits/audit_identity.py comaps
          python3 v2/audits/audit_signals.py comaps --allow-convenience-style | tee out/SIGNAL_SOURCE_AUDIT.txt
          python3 v2/tests/signals_audit_selftest.py comaps --allow-convenience-style | tee out/SIGNAL_AUDIT_SELFTEST.txt
          python3 v2/audits/audit_convenience.py
          git -C comaps diff --check
          git -C comaps diff --name-only | tee out/DIFF_FILES.txt
          ! grep -E 'Cb6Supplement|nativeSetCb6DrivingMarks' out/DIFF_FILES.txt
      - name: Configure resources
        run: |
          set -euxo pipefail
          cd comaps
          bash -x ./configure.sh --skip-map-download 2>&1 | tee ../out/CONFIGURE.log
      - name: Reverify gated control state before build
        run: python3 v2/gates/create_gate_stamp.py --verify
      - name: Inspect generated convenience C++
        run: |
          set -euxo pipefail
          nl -ba comaps/android/sdk/src/main/cpp/app/organicmaps/sdk/Framework.cpp | sed -n '920,1030p'
      - name: Build integrated Signal and convenience brands arm64 release
        run: |
          set -euxo pipefail
          cd comaps/android
          ./gradlew -Parm64 app:assembleWebRelease --no-daemon --stacktrace 2>&1 | tee ../../out/GRADLE.log
      - name: Verify integrated Signal and convenience brands APK
        run: |
          set -euxo pipefail
          mkdir -p verify-apk
          APK="$(find comaps/android/app/build/outputs/apk/web/release -type f -name '*.apk' | head -1)"
          test -n "$APK"
          cp "$APK" out/CB6-V2-Signal-Convenience-arm64.apk
          unzip -q out/CB6-V2-Signal-Convenience-arm64.apk 'lib/arm64-v8a/liborganicmaps.so' -d verify-apk
          file verify-apk/lib/arm64-v8a/liborganicmaps.so | tee out/NATIVE_VERIFY.txt
          readelf -h verify-apk/lib/arm64-v8a/liborganicmaps.so | grep -E 'AArch64|ARM aarch64'
          strings verify-apk/lib/arm64-v8a/liborganicmaps.so | grep -F 'nativeCb6CollectConvenienceMarks'
          strings verify-apk/lib/arm64-v8a/liborganicmaps.so | grep -F 'nativeSetCb6ConvenienceMarks'
          strings verify-apk/lib/arm64-v8a/liborganicmaps.so | grep -F 'cb6-seven'
          strings verify-apk/lib/arm64-v8a/liborganicmaps.so | grep -F 'cb6-lawson'
          strings verify-apk/lib/arm64-v8a/liborganicmaps.so | grep -F 'nativeSetCb6Signals'
          python3 v2/audits/audit_signals.py comaps --allow-convenience-style --apk out/CB6-V2-Signal-Convenience-arm64.apk | tee out/APK_SIGNAL_AUDIT.txt
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -1)"
          "$AAPT" dump badging out/CB6-V2-Signal-Convenience-arm64.apk | tee out/APK_BADGING.txt
          grep -F "package: name='jp.cb6.navi'" out/APK_BADGING.txt
          grep -F "application-label:'CB6 Navi'" out/APK_BADGING.txt
          sha256sum out/CB6-V2-Signal-Convenience-arm64.apk | tee out/SHA256SUMS.txt
          sha256sum out/CB6-V2-Signal-Convenience-arm64.apk > out/APK_SHA256.txt
          python3 v2/gates/create_apk_evidence.py convenience-brands out/CB6-V2-Signal-Convenience-arm64.apk out/APK_SHA256.txt
          python3 v2/gates/verify_apk_evidence.py v2/gates/apk_evidence/convenience-brands.json
          cp v2/gates/apk_evidence/convenience-brands.json out/APK_EVIDENCE.json
      - name: Upload convenience brands evidence
        uses: actions/upload-artifact@v4
        with:
          name: CB6-V2-Signal-Convenience-arm64
          path: |
            out/CB6-V2-Signal-Convenience-arm64.apk
            out/UPSTREAM_SHA.txt
            out/DIFF_FILES.txt
            out/APK_BADGING.txt
            out/NATIVE_VERIFY.txt
            out/SHA256SUMS.txt
            out/APK_SHA256.txt
            out/APK_EVIDENCE.json
            out/CONFIGURE.log
            out/GRADLE.log
          if-no-files-found: error
