name: CB6 V2 Gate 0B Identity

on:
  workflow_dispatch:
  push:
    branches:
      - cb6-v2-clean
    paths:
      - '.github/workflows/build_cb6_v2_identity.yml'
      - 'v2/baseline/**'
      - 'v2/audits/audit_identity.py'

permissions:
  contents: read

jobs:
  build:
    name: V2 Gate 0B minimal identity arm64
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SKIP_MAP_DOWNLOAD: "true"
    steps:
      - name: Checkout V2 control repo
        uses: actions/checkout@v4
      - name: Enforce CB6 development gate
        run: python3 v2/gates/verify_project_gate.py --require-feature-build --feature=identity

      - name: Preflight V2 identity scope
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m py_compile v2/baseline/apply_identity.py v2/audits/audit_identity.py
          grep -F "jp.cb6.navi" v2/baseline/apply_identity.py
          grep -F "CB6 Navi" v2/baseline/apply_identity.py
          ! grep -E "apply_cb6_|Overpass|Cb6Supplement|traffic_signals|shop=convenience|nativeSetCb6DrivingMarks" v2/baseline/apply_identity.py

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -y
          sudo apt-get install -y ninja-build cmake qt6-base-dev qt6-declarative-dev qt6-positioning-dev libqt6svg6-dev optipng libfreetype-dev libharfbuzz-dev libxkbcommon-dev libxkbcommon-x11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev python3-pip python3-venv rsync jq zlib1g-dev unzip
          pip install 'protobuf<3.21' --break-system-packages

      - name: Clone exact pinned CoMaps
        shell: bash
        run: |
          set -euxo pipefail
          git init comaps
          git -C comaps remote add origin https://github.com/comaps/comaps.git
          git -C comaps fetch --depth=1 origin 7113ccb5f086183f8884b2aa4e58c987466b6704
          git -C comaps checkout --detach FETCH_HEAD
          test "$(git -C comaps rev-parse HEAD)" = "7113ccb5f086183f8884b2aa4e58c987466b6704"
          git -C comaps submodule sync --recursive
          git -C comaps config submodule.3party/freetype/freetype.url https://github.com/freetype/freetype.git
          git -C comaps config submodule.3party/protobuf/protobuf.url https://github.com/protocolbuffers/protobuf.git
          for attempt in 1 2 3 4 5 6; do
            if git -C comaps submodule update --init --recursive --depth=1 --jobs=8; then break; fi
            sleep $((attempt*15))
          done
          test -f comaps/3party/protobuf/protobuf/src/google/protobuf/arena.cc
          mkdir -p out
          git -C comaps rev-parse HEAD | tee out/UPSTREAM_SHA.txt

      - name: Apply only V2 minimal identity
        shell: bash
        run: |
          set -euxo pipefail
          python3 v2/baseline/apply_identity.py comaps
          python3 v2/audits/audit_identity.py comaps
          git -C comaps diff -- android/app/build.gradle | tee out/IDENTITY_DIFF.patch
          test "$(git -C comaps diff --name-only | wc -l)" -eq 1
          test "$(git -C comaps diff --name-only)" = "android/app/build.gradle"
          ! grep -E "Cb6Supplement|traffic_signals|shop=convenience|nativeSetCb6DrivingMarks" out/IDENTITY_DIFF.patch

      - name: Configure resources
        shell: bash
        run: |
          set -euxo pipefail
          cd comaps
          bash -x ./configure.sh --skip-map-download 2>&1 | tee ../out/CONFIGURE.log

      - name: Final generated-tree identity audit
        shell: bash
        run: |
          set -euxo pipefail
          python3 v2/audits/audit_identity.py comaps
          git -C comaps diff -- android/app/build.gradle | tee out/FINAL_IDENTITY_DIFF.patch
          grep -F "jp.cb6.navi" comaps/android/app/build.gradle
          grep -F "CB6 Navi" comaps/android/app/build.gradle

      - name: Build CB6 identity arm64 release
        shell: bash
        run: |
          set -euxo pipefail
          cd comaps/android
          ./gradlew -Parm64 app:assembleWebRelease --no-daemon --stacktrace 2>&1 | tee ../../out/GRADLE.log

      - name: Verify Gate 0B APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p verify-apk
          APK="$(find comaps/android/app/build/outputs/apk/web/release -type f -name '*.apk' | head -1)"
          test -n "$APK"
          cp "$APK" out/CB6-V2-Gate0B-Identity-arm64.apk
          unzip -q out/CB6-V2-Gate0B-Identity-arm64.apk 'lib/arm64-v8a/liborganicmaps.so' -d verify-apk
          file verify-apk/lib/arm64-v8a/liborganicmaps.so | tee out/NATIVE_VERIFY.txt
          readelf -h verify-apk/lib/arm64-v8a/liborganicmaps.so | grep -E 'AArch64|ARM aarch64'
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -1)"
          "$AAPT" dump badging out/CB6-V2-Gate0B-Identity-arm64.apk | tee out/APK_BADGING.txt
          grep -F "package: name='jp.cb6.navi'" out/APK_BADGING.txt
          grep -F "application-label:'CB6 Navi'" out/APK_BADGING.txt
          sha256sum out/CB6-V2-Gate0B-Identity-arm64.apk | tee out/SHA256SUMS.txt

      - name: Upload Gate 0B evidence
        uses: actions/upload-artifact@v4
        with:
          name: CB6-V2-Gate0B-Identity-arm64
          path: |
            out/CB6-V2-Gate0B-Identity-arm64.apk
            out/UPSTREAM_SHA.txt
            out/IDENTITY_DIFF.patch
            out/FINAL_IDENTITY_DIFF.patch
            out/APK_BADGING.txt
            out/NATIVE_VERIFY.txt
            out/SHA256SUMS.txt
            out/CONFIGURE.log
            out/GRADLE.log
          if-no-files-found: error
