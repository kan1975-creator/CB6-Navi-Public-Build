name: CB6 APK Build Preflight Independent Review
on:
  workflow_dispatch:
  push:
    branches: [cb6-v2-clean]
    paths:
      - 'v2/gates/apk_build_preflight_independent_review.json'
      - 'v2/gates/verify_apk_build_preflight_independent_review.py'
      - 'v2/tests/test_apk_build_preflight_independent_review_fail_closed.py'
      - '.github/workflows/cb6_apk_build_preflight_independent_review.yml'
permissions:
  contents: read
jobs:
  independent-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Independent review
        run: python3 v2/gates/verify_apk_build_preflight_independent_review.py
      - name: Destructive independent review test
        run: python3 v2/tests/test_apk_build_preflight_independent_review_fail_closed.py
      - name: Verify active Method remains frozen
        run: python3 v2/gates/verify_method_freeze.py
      - name: Verify active cross-cutting foundation remains valid
        run: python3 v2/gates/verify_cross_cutting_rule_foundation_active.py
