name: Future Rule Intake Precheck Independent Review

on:
  push:
    branches: [cb6-v2-clean]
    paths:
      - 'v2/gates/verify_future_rule_intake_precheck_independent_review.py'
      - 'v2/tests/test_future_rule_intake_precheck_independent_review_fail_closed.py'
      - '.github/workflows/future_rule_intake_precheck_independent_review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review HEAD
        uses: actions/checkout@v4
      - name: Independent semantic review
        run: python3 v2/gates/verify_future_rule_intake_precheck_independent_review.py
      - name: Destructive independent-review test
        run: python3 v2/tests/test_future_rule_intake_precheck_independent_review_fail_closed.py
