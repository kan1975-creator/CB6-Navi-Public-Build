name: CB6 Governance Independent Review
on:
  push:
    branches:
      - 'review/governance-adoption'
permissions:
  contents: read
jobs:
  independent-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify dedicated review entry
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "review/governance-adoption"
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          echo "CB6 GOVERNANCE REVIEW ENTRY PASS: branch=$GITHUB_REF_NAME target=$GITHUB_SHA event=$GITHUB_EVENT_NAME"
      - name: Review prechange authority against candidates
        run: python3 v2/gates/verify_governance_independent_review.py
      - name: Destructive test governance review
        run: python3 v2/tests/test_governance_independent_review_fail_closed.py
      - name: Review v2 to v3 pre-fix approval candidate
        run: python3 v2/gates/verify_governance_v3_independent_review.py
      - name: Destructive test v2 to v3 governance review
        run: python3 v2/tests/test_governance_v3_independent_review_fail_closed.py
      - name: Review v3 active method revision candidate
        run: |
          python3 v2/gates/verify_operational_rule_registry_v3_candidate.py
          python3 v2/gates/verify_rule_coverage_v3_candidate.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=Path('.')
          c=json.loads((r/'v2/gates/governance_v3_method_revision_change_record.json').read_text())
          assert c['status']=='IMPLEMENTED_UNVERIFIED'
          assert c['basis_head']=='8a8479345457e3ffd695a05a8e86a6e07df909fb'
          assert c['active_authority_unchanged'] is True
          assert c['freeze_lock_unchanged'] is True
          assert 'v2/gates/method_freeze_lock.json' in c['affected_frozen_files']
          print('CB6 GOVERNANCE V3 METHOD REVISION INDEPENDENT REVIEW PASS: candidate verified; prechange authority preserved; freeze lock preserved')
          PY
      - name: Destructive test v3 active method revision candidate
        run: |
          python3 v2/tests/test_operational_rule_registry_v3_candidate_fail_closed.py
          python3 v2/tests/test_rule_coverage_v3_candidate_fail_closed.py
      - name: Verify Status Reporting v3 remains ACTIVE authority
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=Path('.')
          a=json.loads((r/'v2/gates/status_reporting_contract_v3.json').read_text(encoding='utf-8'))
          reg=json.loads((r/'v2/gates/operational_rule_registry_v6.json').read_text(encoding='utf-8'))
          rules={x.get('id'):x for x in reg.get('rules',[])}
          assert a.get('schema')==3
          assert a.get('status')=='ACTIVE'
          assert rules['OPS-STATUS-REPORTING-001'].get('status')=='ACTIVE'
          assert rules['OPS-STATUS-REPORTING-001'].get('contract')=='v2/gates/status_reporting_contract_v3.json'
          print('CB6 STATUS REPORTING V3 ACTIVE AUTHORITY PASS: ACTIVE v3 and registry v6 binding preserved')
          PY
      - name: Review Status Reporting v4 final-four-line and smartphone-action candidate
        run: python3 v2/gates/verify_status_reporting_v4_independent_review.py
      - name: Destructive test Status Reporting v4 independent review
        run: python3 v2/tests/test_status_reporting_v4_independent_review_fail_closed.py
      - name: Review Status Reporting v5 wait-time candidate
        run: python3 v2/gates/verify_status_reporting_v5_independent_review.py
      - name: Destructive test Status Reporting v5 independent review
        run: python3 v2/tests/test_status_reporting_v5_independent_review_fail_closed.py
      - name: Review Status Reporting v6 final-summary candidate
        run: python3 v2/gates/verify_status_reporting_v6_independent_review.py
      - name: Destructive test Status Reporting v6 independent review
        run: python3 v2/tests/test_status_reporting_v6_independent_review_fail_closed.py
      - name: Review Status Reporting v7 normal-duration candidate
        run: python3 v2/gates/verify_status_reporting_v7_independent_review.py
      - name: Destructive test Status Reporting v7 independent review
        run: python3 v2/tests/test_status_reporting_v7_independent_review_fail_closed.py
      - name: Review Status Reporting v8 all-process wait evidence candidate
        run: python3 v2/gates/verify_status_reporting_v8_independent_review.py
      - name: Destructive test Status Reporting v8 independent review
        run: python3 v2/tests/test_status_reporting_v8_independent_review_fail_closed.py
      - name: Review Status Reporting v9 response-preflight candidate
        run: python3 v2/gates/verify_status_reporting_v9_independent_review.py
      - name: Destructive test Status Reporting v9 independent review
        run: python3 v2/tests/test_status_reporting_v9_independent_review_fail_closed.py
      - name: Review Status Reporting v10 known-run direct-refresh candidate
        run: python3 v2/gates/verify_status_reporting_v10_independent_review.py
      - name: Destructive test Status Reporting v10 independent review
        run: python3 v2/tests/test_status_reporting_v10_independent_review_fail_closed.py
      - name: Review Rule Consistency Preflight candidate
        run: python3 v2/gates/verify_rule_consistency_preflight_independent_review.py
      - name: Destructive test Rule Consistency Preflight independent review
        run: python3 v2/tests/test_rule_consistency_preflight_independent_review_fail_closed.py
