name: CB6 Governance Normalization Candidate
on:
  pull_request:
    branches: [cb6-v2-clean]
    paths:
      - 'docs/CB6_NORMALIZATION_CANDIDATE.md'
      - 'v2/gates/verify_normalization_candidate.py'
      - 'v2/tests/test_normalization_candidate_fail_closed.py'
      - '.github/workflows/cb6_normalization_candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  actions: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify checkout and destructive tests
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 v2/tests/test_normalization_candidate_fail_closed.py
      - name: Fetch and audit live GitHub evidence (advisory, release blocked)
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euxo pipefail
          python3 v2/gates/verify_normalization_candidate.py "$PR_NUMBER" "$PR_HEAD" "$PR_BASE"
      - name: Preserve release and retirement block
        run: |
          echo 'Candidate-only evidence audit. Not user approval, merge permission, APK acceptance, or legacy gate retirement.'
