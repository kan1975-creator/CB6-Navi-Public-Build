name: Auditor V2 Atomic Coverage E2E Candidate
on:
  workflow_dispatch:
  push:
    branches: [cb6-v2-clean]
    paths:
      - 'v2/gates/development_auditor_v2_atomic_coverage_e2e_cases.json'
      - 'v2/gates/verify_development_auditor_v2_atomic_coverage_e2e.py'
      - 'v2/tests/test_development_auditor_v2_atomic_coverage_e2e_fail_closed.py'
      - '.github/workflows/development_auditor_v2_atomic_coverage_e2e_candidate.yml'
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify atomic coverage E2E
        run: python3 v2/gates/verify_development_auditor_v2_atomic_coverage_e2e.py
      - name: Destructive atomic proof
        run: python3 v2/tests/test_development_auditor_v2_atomic_coverage_e2e_fail_closed.py
